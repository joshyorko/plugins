<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Control Room</title>
<style>
:root{color-scheme:light dark;--bg:#101318;--panel:#171c24;--line:#303947;--text:#edf2f7;--muted:#9aa7b5;--accent:#79d5b0;--warn:#f2c46d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px ui-monospace,SFMono-Regular,monospace}main{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:14px}.eyebrow{color:var(--accent);letter-spacing:.12em;font-size:11px}.muted{color:var(--muted)}h1{font:600 24px system-ui;margin:5px 0 0}.modes{display:flex;gap:6px}button,select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px;padding:8px 10px;font:inherit}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button.active{border-color:var(--accent);color:var(--accent)}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-top:12px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px}.panel h2{font:600 14px system-ui;margin:0 0 12px}.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.count{border-left:3px solid var(--accent);padding:9px;background:#ffffff08}.count b{display:block;font-size:20px}.cards{display:grid;gap:8px}.card{border:1px solid var(--line);border-radius:6px;padding:10px}.tag{color:var(--warn);font-size:11px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.prompt{white-space:pre-wrap;min-height:130px;color:#c7f5df;background:#0b0e12;padding:10px;border-radius:6px;overflow:auto}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:700px){.top,.grid{display:block}.modes{margin-top:12px}.panel{margin-top:12px}.counts{grid-template-columns:repeat(3,1fr)}}
@media (prefers-color-scheme: light){:root{--bg:#f4f7f8;--panel:#ffffff;--line:#cbd5dc;--text:#15202b;--muted:#536574;--accent:#087f62;--warn:#95630b}.prompt{color:#07553f;background:#e7efec}.count{background:#15202b08}}
</style></head><body><main><header class="top"><div><div class="eyebrow">SOFTWARE FACTORY / MCP APPS V2</div><h1>Control Room <span class="muted">· PLAN</span></h1></div><nav class="modes" aria-label="Control room mode"><button class="active" data-mode="PLAN">PLAN</button><button data-mode="OPERATE">OPERATE</button></nav></header><section class="grid"><div class="panel"><h2>Observed repository</h2><div id="target" class="muted">UNKNOWN · refresh to reconstruct authoritative state</div><div class="counts" id="counts" aria-live="polite"></div><div class="cards" id="items"><div class="empty">No snapshot loaded. Unknown is preserved until a read-only tool result arrives.</div></div></div><aside class="panel"><h2>Operator intent</h2><label for="action">Action</label><select id="action"><option>PLAN</option><option>START</option><option>RESUME</option><option>RECONCILE</option><option>STATUS</option><option>DRAIN</option><option>CHECKPOINT</option><option>QUIESCE</option></select><div class="actions"><button id="refresh">Refresh snapshot</button><button id="prompt">Preview prompt</button><button id="copy">Copy preview</button></div><h2 style="margin-top:18px">Prompt preview</h2><div id="preview" class="prompt" tabindex="0">Not generated. A preview is never execution.</div></aside></section></main><script>
const state={snapshot:null,prompt:""};const $=s=>document.querySelector(s);function render(s){state.snapshot=s;$('#target').textContent=`${s.repository??"UNKNOWN"} · ${s.targetBranch??"UNKNOWN"} · ${s.observedHead??"UNKNOWN"} · ${s.status??"UNKNOWN"}`;$('#counts').innerHTML=Object.entries(s.statuses??{}).map(([k,v])=>`<div class="count"><span>${k}</span><b>${v}</b></div>`).join("");$('#items').innerHTML=(s.candidates??[]).map(x=>`<div class="card"><span class="tag">${x.status??"UNKNOWN"}</span><br>${x.title??"Unnamed candidate"}<br><span class="muted">${x.reason??"No reason supplied."}</span></div>`).join("")||'<div class="empty">No candidates observed.</div>'}window.addEventListener("message",e=>{const m=e.data;if(m?.method==="ui/notifications/tool-result"&&m.params?.structuredContent)render(m.params.structuredContent)});$('#refresh').onclick=()=>window.parent.postMessage({jsonrpc:"2.0",method:"tools/call",params:{name:"factory_snapshot",arguments:{}}},"*");$('#prompt').onclick=()=>{const s=state.snapshot??{};state.prompt=`DISPATCH TO AGENT\nAction: ${$('#action').value}\nRepository: ${s.repository??"UNKNOWN"}\nObserved head: ${s.observedHead??"UNKNOWN"}\nThis is a generated prompt preview; it has not been executed.`;$('#preview').textContent=state.prompt};$('#copy').onclick=async()=>{if(state.prompt)await navigator.clipboard?.writeText(state.prompt)};document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b)));
</script></body></html>

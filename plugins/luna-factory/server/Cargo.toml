[package]
name = "luna-factoryd"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Durable local control plane for the canonical Luna Factory plugin"

[dependencies]
anyhow = "1"
base64 = "=0.23.1"
axum = "0.8"
fs2 = "0.4"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "=3.5.0", features = ["server", "transport-streamable-http-server", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["limit"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonschema = { version = "0.33", default-features = false }
